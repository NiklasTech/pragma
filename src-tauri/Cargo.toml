[package]
name = "app"
version = "0.5.1"
description = "A lightweight, AI-native desktop IDE with an integrated terminal"
authors = ["NiklasTech <info@nh-webdev.de>"]
license = "Apache-2.0"
repository = "https://github.com/NiklasTech/pragma"
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chardetng = "0.1.17"
encoding_rs = "0.8.35"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["image-png", "unstable"] }
tauri-plugin-log = "2.9"
portable-pty = "0.9"
uuid = { version = "1.16", features = ["v4"] }
tauri-plugin-cli = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

libc = "0.2"
shared_child = "1"
notify = "7.0"
chrono = { version = "0.4", features = ["serde"] }
diffy = "0.5"
sha2 = "0.10"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", features = ["process", "rt-multi-thread", "macros", "net"] }
zip = { version = "4.2", default-features = false, features = ["deflate"] }
tokio-util = "0.7"
shellwords = "1.1.0"
sysinfo = "0.39"
bollard = "0.21"
ignore = "0.4"
regex = "1.0"
tauri-plugin-clipboard-manager = "2"
base64 = "0.23"
flate2 = "1"
tar = "0.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
tauri-plugin-notification = "~2.4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }
webkit2gtk = "=2.0.2"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
  "NSData",
  "NSDictionary",
  "NSError",
  "NSString",
] }
objc2-web-kit = { version = "0.3.2", features = [
  "block2",
  "objc2-app-kit",
  "WKSnapshotConfiguration",
  "WKWebView",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }

[features]
test-fixtures = []

[dev-dependencies]
tauri = { version = "2.11.2", features = ["test"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "echo-mcp-server"
path = "tests/fixtures/echo_mcp_server.rs"
required-features = ["test-fixtures"]

[[bench]]
name = "file_explorer"
harness = false

[[bench]]
name = "git_log"
harness = false

[[bench]]
name = "git_graph_layout"
harness = false
