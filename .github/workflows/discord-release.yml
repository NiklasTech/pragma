name: Discord Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce, e.g. v0.5.1"
        required: true

permissions:
  contents: read

jobs:
  announce:
    name: Announce on Discord
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Post release to Discord
        run: node scripts/discord-release.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ROLE_ID: "1554572240249430046"
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
