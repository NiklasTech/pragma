name: Coding CLI Handshake

# Installs the coding CLIs from src-tauri/src/ai/cli/manifest.rs and checks that each answers the
# ACP handshake without a login. See docs/CODING_CLIS.md.
on:
  pull_request:
    branches: [main]
    paths:
      - src-tauri/src/ai/cli/manifest.rs
      - scripts/acp-handshake.mjs
      - .github/workflows/cli-handshake.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handshake:
    name: ACP handshake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install coding CLIs
        run: >-
          npm install -g @openai/codex @google/gemini-cli @github/copilot @xai-official/grok
          @moonshot-ai/kimi-code @opencode/cli @deepseek-ai/dsh

      - name: Check the ACP handshake
        run: >-
          node scripts/acp-handshake.mjs --timeout 180
          --require anthropic-claude,openai-codex,google-gemini,github-copilot,xai-grok,moonshot-kimi,opencode,deepseek-harness
