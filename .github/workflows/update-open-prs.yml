name: Keep auto-merge pull requests up to date

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-branches:
    name: Update stale auto-merge branches
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Collect auto-merge pull requests that are behind
        id: collect
        run: |
          behind=""
          for number in $(gh pr list --state open \
            --json number,isDraft,autoMergeRequest \
            --jq '.[] | select(.isDraft | not) | select(.autoMergeRequest != null) | .number'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.mergeable_state' 2>/dev/null || echo unknown)
            if [ "$state" = "unknown" ] || [ "$state" = "null" ]; then
              # GitHub computes mergeability lazily: the first read often returns
              # unknown, a second read a moment later returns the real state.
              sleep 3
              state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.mergeable_state' 2>/dev/null || echo unknown)
            fi
            echo "#$number mergeable_state=$state"
            if [ "$state" = "behind" ]; then
              behind="$behind $number"
            fi
          done
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

      - name: Bring the behind branches up to date
        if: steps.collect.outputs.behind != ''
        run: |
          for number in ${{ steps.collect.outputs.behind }}; do
            branch=$(gh pr view "$number" --json headRefName --jq '.headRefName')
            case "$branch" in
              dependabot/*)
                # Dependabot regenerates its own branch and lockfile; merging main
                # in by hand can leave an inconsistent lockfile behind.
                echo "asking dependabot to rebase #$number"
                gh pr comment "$number" --body "@dependabot rebase" ;;
              *)
                echo "updating branch of #$number"
                gh pr update-branch "$number" || true ;;
            esac
          done
